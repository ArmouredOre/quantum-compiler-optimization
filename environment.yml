name: qco
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pyyaml>=6.0
  - networkx>=3.2
  - matplotlib>=3.8
  - pandas>=2.2
  - pytest>=8.0
  # KaHyPar / METIS are available on conda-forge:
  - metis
  - pip:
      - qiskit>=1.0
      - qiskit-aer>=0.14
      - cirq>=1.3
      - pytket>=1.28
      - torch>=2.2
      - stable-baselines3>=2.3
      - gymnasium>=0.29
      - torch-geometric>=2.5
      - z3-solver>=4.13
      - pymoo>=0.6
      - deap>=1.4
      - -e .
