<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1320" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowFB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <style>
    .stage  { fill:#eef4ff; stroke:#3366cc; stroke-width:1.5; }
    .io     { fill:#f1f5f9; stroke:#64748b; stroke-width:1.5; }
    .mod    { fill:#ffffff; stroke:#3366cc; stroke-width:1.5; }
    .lbl    { fill:#0f172a; font-size:15px; font-weight:600; }
    .sub    { fill:#334155; font-size:12px; }
    .tag    { fill:#2563eb; font-size:11px; font-weight:600; }
    .edge   { stroke:#334155; stroke-width:1.6; fill:none; }
    .edgeFB { stroke:#c2410c; stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
    .elbl   { fill:#475569; font-size:11px; }
    .fblbl  { fill:#c2410c; font-size:11px; font-weight:600; }
    .banner { fill:#3366cc; font-size:12px; font-weight:700; letter-spacing:.5px; }
  </style>

  <!-- Input -->
  <rect class="io" x="330" y="20" width="300" height="52" rx="9"/>
  <text class="lbl" x="480" y="42" text-anchor="middle">Input circuit</text>
  <text class="sub" x="480" y="60" text-anchor="middle">OpenQASM 2.0 / Qiskit / Cirq</text>

  <!-- Stage 1 -->
  <text class="banner" x="70" y="110">STAGE 1 — FRONT END</text>
  <rect class="stage" x="330" y="118" width="300" height="66" rx="9"/>
  <text class="lbl" x="480" y="145" text-anchor="middle">Parser &amp; IR Builder</text>
  <text class="sub" x="480" y="165" text-anchor="middle">→ internal intermediate representation</text>
  <text class="tag" x="480" y="180" text-anchor="middle">Ajay M · 24BCE2493</text>

  <!-- Stage 2 -->
  <text class="banner" x="70" y="228">STAGE 2 — GRAPH CONSTRUCTION</text>
  <rect class="stage" x="150" y="236" width="300" height="72" rx="9"/>
  <text class="lbl" x="300" y="262" text-anchor="middle">Gate-dependency DAG</text>
  <text class="sub" x="300" y="282" text-anchor="middle">nodes = gates</text>
  <text class="sub" x="300" y="298" text-anchor="middle">edges = qubit-wire dependencies</text>

  <rect class="stage" x="510" y="236" width="300" height="72" rx="9"/>
  <text class="lbl" x="660" y="262" text-anchor="middle">Qubit-interaction hypergraph</text>
  <text class="sub" x="660" y="282" text-anchor="middle">vertices = qubits</text>
  <text class="sub" x="660" y="298" text-anchor="middle">hyperedges = multi-qubit gates</text>

  <!-- Stage 3 -->
  <text class="banner" x="70" y="352">STAGE 3 — PARTITIONING &amp; BLOCK SCHEDULING</text>
  <rect class="stage" x="300" y="360" width="360" height="66" rx="9"/>
  <text class="lbl" x="480" y="387" text-anchor="middle">Multilevel partitioning — KaHyPar / METIS</text>
  <text class="sub" x="480" y="407" text-anchor="middle">large circuit → near-independent blocks (parallel)</text>

  <!-- Stage 4 -->
  <text class="banner" x="70" y="470">STAGE 4 — COOPERATING OPTIMIZATION MODULES  (per block)</text>
  <rect class="stage" x="70" y="480" width="820" height="200" rx="12"/>

  <rect class="mod" x="96" y="516" width="230" height="130" rx="9"/>
  <text class="lbl" x="211" y="546" text-anchor="middle">Module A</text>
  <text class="sub" x="211" y="566" text-anchor="middle">RL Adaptive Scheduler</text>
  <text class="sub" x="211" y="583" text-anchor="middle">PPO / DDQN</text>
  <text class="sub" x="211" y="600" text-anchor="middle">reorder · commute · rewrite</text>
  <text class="tag" x="211" y="622" text-anchor="middle">Maanas Nair · 24BCT0157</text>

  <rect class="mod" x="365" y="516" width="230" height="130" rx="9"/>
  <text class="lbl" x="480" y="546" text-anchor="middle">Module B</text>
  <text class="sub" x="480" y="566" text-anchor="middle">GNN Cancellation Predictor</text>
  <text class="sub" x="480" y="583" text-anchor="middle">GraphSAGE / GAT</text>
  <text class="sub" x="480" y="600" text-anchor="middle">ranks cancellation candidates</text>
  <text class="tag" x="480" y="622" text-anchor="middle">Prisha · 24BDS0146</text>

  <rect class="mod" x="634" y="516" width="230" height="130" rx="9"/>
  <text class="lbl" x="749" y="546" text-anchor="middle">Module C</text>
  <text class="sub" x="749" y="566" text-anchor="middle">SAT/SMT Verifier &amp;</text>
  <text class="sub" x="749" y="583" text-anchor="middle">Bounded Optimizer — Z3 / CVC5</text>
  <text class="sub" x="749" y="600" text-anchor="middle">checks every rewrite</text>
  <text class="tag" x="749" y="622" text-anchor="middle">Sahib Singh · 24BCI0292</text>

  <path class="edge" d="M326 581 H365" marker-end="url(#arrow)"/>
  <path class="edge" d="M595 581 H634" marker-end="url(#arrow)"/>
  <path class="edge" d="M634 636 C 470 690, 400 690, 326 636" marker-end="url(#arrow)"/>
  <text class="elbl" x="480" y="686" text-anchor="middle">rejected rewrite → revert</text>

  <!-- Stage 5 -->
  <text class="banner" x="70" y="730">STAGE 5 — MODULE D</text>
  <rect class="stage" x="270" y="738" width="420" height="86" rx="9"/>
  <text class="lbl" x="480" y="765" text-anchor="middle">Evolutionary Multi-Objective Search</text>
  <text class="sub" x="480" y="785" text-anchor="middle">NSGA-II (pymoo / DEAP) · fidelity surrogates</text>
  <text class="sub" x="480" y="803" text-anchor="middle">→ Pareto front of circuit variants</text>
  <text class="tag" x="480" y="819" text-anchor="middle">Swaraj Rane · 24BCT0086</text>

  <!-- Stage 6 -->
  <text class="banner" x="70" y="868">STAGE 6 — EVALUATION &amp; BENCHMARKING ENGINE</text>
  <rect class="stage" x="230" y="876" width="500" height="86" rx="9"/>
  <text class="lbl" x="480" y="903" text-anchor="middle">5 metrics vs Qiskit O0–O3</text>
  <text class="sub" x="480" y="923" text-anchor="middle">gate count · depth · exec time · fidelity · optimizer runtime</text>
  <text class="tag" x="480" y="945" text-anchor="middle">Swaraj Rane · 24BCT0086</text>

  <!-- Output -->
  <rect class="io" x="300" y="1010" width="360" height="58" rx="9"/>
  <text class="lbl" x="480" y="1035" text-anchor="middle">Output</text>
  <text class="sub" x="480" y="1053" text-anchor="middle">Pareto-optimal circuit variants + benchmark report</text>

  <!-- vertical edges -->
  <path class="edge" d="M480 72 V118" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 184 C 360 205, 320 215, 300 236" marker-end="url(#arrow)"/>
  <path class="edge" d="M540 184 C 600 205, 640 215, 660 236" marker-end="url(#arrow)"/>
  <path class="edge" d="M300 308 C 320 330, 360 340, 430 360" marker-end="url(#arrow)"/>
  <path class="edge" d="M660 308 C 640 330, 600 340, 530 360" marker-end="url(#arrow)"/>
  <path class="edge" d="M480 426 V480" marker-end="url(#arrow)"/>
  <text class="elbl" x="496" y="456">blocks</text>
  <path class="edge" d="M480 680 V738" marker-end="url(#arrow)"/>
  <text class="elbl" x="496" y="712">verified candidate circuits</text>
  <path class="edge" d="M480 824 V876" marker-end="url(#arrow)"/>
  <text class="elbl" x="496" y="854">Pareto front</text>
  <path class="edge" d="M480 962 V1010" marker-end="url(#arrow)"/>

  <!-- closed-loop feedback -->
  <path class="edgeFB" d="M730 919 C 900 900, 920 640, 920 590 C 920 560, 900 552, 864 552" marker-end="url(#arrowFB)"/>
  <text class="fblbl" x="915" y="740" text-anchor="end">reward signal</text>
  <text class="fblbl" x="915" y="756" text-anchor="end">(closed loop → Module A)</text>
</svg>
